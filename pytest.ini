[pytest]
# Pytest configuration for vr_cricket_strategist tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = 
    agents/vr_cricket_strategist/tests

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run

# Coverage options (if using pytest-cov)
# addopts = --cov=agents/vr_cricket_strategist --cov-report=html --cov-report=term

# Ignore paths
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    venv
    __pycache__

